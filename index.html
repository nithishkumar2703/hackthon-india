<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hackathon India</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #0F172A; color: #E2E8F0; font-family: 'Segoe UI', Roboto, Arial, sans-serif; overflow-x: hidden; }
  ::-webkit-scrollbar { height: 5px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

  /* ---------- Header ---------- */
  .header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: rgba(15,23,42,.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1E293B; position: sticky; top: 0; z-index: 100; }
  .logo-box { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .logo-box img { height: 36px; width: auto; }
  .brand { color: #fff; font-size: 12px; font-weight: 800; line-height: 1.2; letter-spacing: .6px; white-space: nowrap; }
  .search { flex: 1; max-width: 440px; position: relative; }
  .search input { width: 100%; background: #1E293B; border: 1px solid transparent; border-radius: 10px; color: #fff; padding: 10px 12px 10px 36px; font-size: 13px; outline: none; transition: border .15s; }
  .search input:focus { border-color: #10B981; }
  .search input::placeholder { color: #64748B; }
  .search .s-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748B; font-size: 13px; pointer-events: none; }
  .suggest { position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: #1E293B; border: 1px solid #334155; border-radius: 12px; overflow: hidden; z-index: 250; box-shadow: 0 12px 34px rgba(0,0,0,.55); z-index: 200; }
  .suggest-label { padding: 8px 14px 4px; font-size: 9px; font-weight: 700; letter-spacing: 1.2px; color: #64748B; }
  .suggest-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13px; color: #fff; cursor: pointer; }
  .suggest-item:hover, .suggest-item.hl { background: #334155; }
  .suggest-item .s-ic { width: 18px; text-align: center; color: #10B981; font-size: 13px; }

  .btn-primary { border: 1.5px solid #10B981; background: transparent; color: #10B981; font-size: 11px; font-weight: 700; padding: 9px 14px; border-radius: 10px; cursor: pointer; white-space: nowrap; line-height: 1.2; text-align: center; transition: all .15s; flex-shrink: 0; }
  .btn-primary:hover { background: rgba(16,185,129,.12); }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #1E293B; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid #334155; color: #94A3B8; background: #1E293B; transition: all .15s; flex-shrink: 0; }
  .chip:hover { border-color: #64748B; }
  .chip.on { background: #10B981; color: #fff; border-color: #10B981; }
  .chip.state.on { background: #7C3AED; border-color: #7C3AED; }
  .chip .count { opacity: .6; font-size: 10px; margin-left: 3px; }

  /* ---------- Grid ---------- */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
    .header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    .search { order: 10; max-width: 100%; flex: 1 1 100%; }
    .search input { font-size: 16px; padding: 12px 12px 12px 38px; }
    .user-box { order: 5; gap: 6px; }
    .user-box .btn-primary { font-size: 12px; padding: 8px 12px; }
    .ending-btn { font-size: 14px; padding: 8px 10px; font-weight: 800; }
    .filters { padding: 8px 12px; gap: 6px; }
    .chip { padding: 5px 12px; font-size: 11px; }
    .suggest { z-index: 300; }
    .post-menu { z-index: 300; right: 0; }
    .modal { margin: 0 10px; max-height: 92vh; }
    .updated-line { font-size: 11px; padding: 6px 12px; }
  }
  @media (max-width: 380px) { .grid { grid-template-columns: 1fr; } }

  .card { background: linear-gradient(180deg, #1E293B 0%, #0F172A 100%); border-radius: 14px; overflow: hidden; border: 1px solid #334155; cursor: pointer; position: relative; transition: transform .15s, box-shadow .15s, border .15s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,.45); border-color: #10B981; }
  .card.faved { border-color: #F59E0B; }
  .card-img { position: relative; height: 110px; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .overlay { position: absolute; inset: 0; background: linear-gradient(transparent 30%, #1E293B 95%); }
  .card-img .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 30px; color: rgba(255,255,255,.12); }
  .badge-status { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; letter-spacing: .4px; color: #fff; }
  .blive { background: #10B981; } .bup { background: #F59E0B; } .bon { background: #3B82F6; } .bend { background: #EF4444; }
  .gov-badge { position: absolute; top: 8px; left: 40px; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; letter-spacing: .4px; color: #fff; background: #7C3AED; display: inline-flex; align-items: center; gap: 4px; z-index: 2; }
  .badge-new { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; letter-spacing: .4px; color: #fff; background: #10B981; z-index: 2; box-shadow: 0 0 0 3px rgba(16,185,129,.25); }
  .updated-line { display: flex; align-items: center; gap: 8px; max-width: 1200px; margin: 16px auto 4px; padding: 0 16px; font-size: 12px; color: #94A3B8; }
  .updated-line .dot { width: 8px; height: 8px; border-radius: 50%; background: #10B981; flex: none; }
  .updated-line b { color: #CBD5E1; font-weight: 600; }
  .off-chip { background: #EF4444; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .4px; padding: 2px 8px; border-radius: 6px; flex: none; }
  .fav-btn { position: absolute; top: 7px; left: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(15,23,42,.65); border: none; color: #94A3B8; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3; }
  .fav-btn.faved { color: #F59E0B; }
  .card-img .title { position: absolute; bottom: 8px; left: 10px; right: 10px; color: #fff; font-size: 12.5px; font-weight: 800; line-height: 1.25; text-transform: uppercase; letter-spacing: .3px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
  .card-body { padding: 9px 12px 12px; }
  .org-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .org-avatar { width: 20px; height: 20px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #94A3B8; flex-shrink: 0; }
  .org-name { font-size: 11px; color: #94A3B8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta-row { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #94A3B8; margin-bottom: 3px; }
  .meta-row i { font-size: 10px; opacity: .5; width: 12px; text-align: center; }
  .prize-row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .prize-label { font-size: 10px; color: #64748B; }
  .prize-val { font-size: 12px; font-weight: 700; color: #fff; }
  .countdown { font-size: 10px; color: #F59E0B; margin-top: 4px; }
  .countdown.closed { color: #EF4444; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { font-size: 9px; padding: 2px 7px; border-radius: 4px; border: 1px solid #334155; color: #94A3B8; }

  /* ---------- Detail ---------- */
  .detail-wrap { position: fixed; inset: 0; z-index: 300; overflow-y: auto; background: #0F172A; animation: slideIn .22s ease; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  .detail-topbar { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: rgba(15,23,42,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #1E293B; z-index: 10; }
  .back-btn { background: none; border: none; color: #94A3B8; font-size: 13px; cursor: pointer; padding: 6px 8px; display: flex; align-items: center; gap: 6px; }
  .back-btn:hover { color: #fff; }
  .tb-logo { height: 26px; margin-left: 4px; }
  .detail-page { max-width: 700px; margin: 0 auto; padding: 0 16px 30px; }
  .detail-hero { width: 100%; height: 240px; object-fit: cover; border-radius: 16px; margin-top: 14px; }
  .detail-ph { width: 100%; height: 240px; border-radius: 16px; background: #1E293B; display: flex; align-items: center; justify-content: center; font-size: 64px; color: rgba(255,255,255,.12); margin-top: 14px; }
  .ph-wrap { position: relative; width: 100%; height: 100%; }
  .ph-wrap .ph { position: absolute; inset: 0; }
  .ph-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ph { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; flex-direction: column; gap: 4px; padding: 8px; box-sizing: border-box; }
  .ph .ph-emoj { font-size: 22px; }
  .ph .ph-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.95); text-align: center; line-height: 1.3; max-width: 100%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .ph .ph-mode { position: absolute; top: 8px; right: 8px; background: rgba(16,185,129,.85); color: #fff; font-size: 8px; font-weight: 700; padding: 3px 8px; border-radius: 5px; letter-spacing: .5px; }
  .ph-wrap.detail-hero .ph-emoj { font-size: 56px; }
  .ph-wrap.detail-hero .ph-title { font-size: 20px; -webkit-line-clamp: 3; }
  .ph-wrap.detail-hero .ph-mode { font-size: 11px; }
  .ph-wrap .logo-img { position: absolute; inset: 0; margin: auto; width: 56px; height: 56px; object-fit: contain; border-radius: 12px; background: rgba(255,255,255,.92); padding: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
  .ph-wrap .govt-img { width: 84px; height: 84px; border-radius: 50%; background: #fff; padding: 6px; }
  .ph-wrap.detail-hero { height: 240px; margin-top: 14px; border-radius: 16px; overflow: hidden; }
  .detail-title { font-size: 24px; font-weight: 800; color: #fff; margin: 16px 0 4px; line-height: 1.3; }
  .detail-tagline { font-size: 13px; color: #94A3B8; margin-bottom: 14px; }
  .detail-badge { display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; color: #fff; margin-top: 14px; }
  .section { background: #1E293B; border-radius: 12px; padding: 14px; margin: 10px 0; }
  .d-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #CBD5E1; margin-bottom: 9px; }
  .d-row:last-child { margin-bottom: 0; }
  .d-row i { font-size: 14px; color: #64748B; width: 18px; text-align: center; }
  .d-row b { color: #fff; font-weight: 600; }
  .prize-big { font-size: 22px; font-weight: 800; color: #F59E0B; }
  .about { font-size: 14px; color: #CBD5E1; line-height: 1.75; margin: 14px 0; }
  .action-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 13px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; margin-bottom: 8px; transition: filter .15s; }
  .action-btn:hover { filter: brightness(1.1); }
  .action-btn.primary { background: #10B981; color: #fff; }
  .action-btn.outline { background: transparent; border: 1.5px solid #334155; color: #E2E8F0; }
  .action-btn.outline:hover { border-color: #64748B; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .action-btn { flex: 1; }

  /* ---------- Post modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(2,6,23,.75); backdrop-filter: blur(4px); z-index: 400; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .2s ease; }
  @media (min-width: 600px) { .modal-overlay { align-items: center; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal { width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: #1E293B; border-radius: 18px 18px 0 0; padding: 20px; border: 1px solid #334155; animation: riseIn .25s ease; }
  @media (min-width: 600px) { .modal { border-radius: 18px; } }
  @keyframes riseIn { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h2 { color: #fff; font-size: 18px; margin-bottom: 4px; }
  .modal .sub { color: #94A3B8; font-size: 12px; margin-bottom: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; color: #94A3B8; font-size: 11px; font-weight: 600; margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 9px; color: #fff; padding: 10px 12px; font-size: 13px; outline: none; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: #10B981; }
  .field select option { background: #1E293B; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
  .modal-actions button { flex: 1; }

  /* ---------- States ---------- */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1E293B; color: #fff; border: 1px solid #10B981; padding: 11px 18px; border-radius: 10px; font-size: 13px; z-index: 500; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: fadeIn .2s ease; }
  .spinner { text-align: center; padding: 70px 20px; color: #64748B; font-size: 14px; }
  .spinner i { font-size: 28px; color: #10B981; display: block; margin-bottom: 12px; }
  .empty { text-align: center; padding: 70px 20px; color: #64748B; }
  .empty i { font-size: 40px; color: #334155; display: block; margin-bottom: 12px; }
  .skeleton { height: 230px; background: linear-gradient(90deg,#1E293B 25%,#263449 50%,#1E293B 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 14px; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .top-btn { position: fixed; top: 92px; left: 14px; z-index: 50; width: 38px; height: 38px; border-radius: 50%; border: 1px solid #334155; background: #1E293B; color: #E2E8F0; font-size: 14px; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .top-btn.show { display: flex; }
  .top-btn:hover { background: #10B981; color: #fff; }

  /* ---------- Auth + Community ---------- */
  .user-box { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .outline-btn { background: transparent; border: 1px solid #334155; color: #E2E8F0; }
  .outline-btn:hover { background: #1E293B; }
  .post-menu-wrap { position: relative; }
  .post-menu { position: absolute; top: calc(100% + 4px); right: 0; background: #1E293B; border: 1px solid #334155; border-radius: 10px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.5); z-index: 250; min-width: 170px; }
  .post-menu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: none; color: #E2E8F0; font-size: 13px; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left; }
  .post-menu button:hover { background: #334155; }
  .post-menu button i { width: 16px; color: #10B981; }
  .ending-btn { font-size: 13px; padding: 8px 12px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .modal-x { background: none; border: none; color: #94A3B8; font-size: 18px; cursor: pointer; padding: 4px; }
  .modal-x:hover { color: #fff; }
  .field { margin: 10px 0; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: #94A3B8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }
  .field input, .field textarea { width: 100%; box-sizing: border-box; background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; color: #E2E8F0; font-size: 13px; font-family: inherit; outline: none; }
  .field input:focus, .field textarea:focus { border-color: #10B981; }
  .link { color: #F59E0B; cursor: pointer; }
  .cbadge { background: #7C3AED; }
  .sec-title { display: flex; align-items: center; justify-content: space-between; padding: 18px 16px 6px; font-size: 13px; font-weight: 800; color: #fff; letter-spacing: .5px; }
  .sec-link { color: #10B981; font-size: 11px; font-weight: 600; cursor: pointer; }
  .ending-bar { background: linear-gradient(135deg, #7C3AED, #EC4899); color: #fff; padding: 10px 16px; border-radius: 12px; margin: 0 16px 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; animation: pulse-end 2s infinite; }
  .ending-bar .e-count { background: #fff; color: #7C3AED; border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; flex-shrink: 0; }
  .ending-bar .e-text { flex: 1; }
  .ending-bar .e-arrow { font-size: 11px; opacity: .7; }
  @keyframes pulse-end { 0%,100% { opacity:1; } 50% { opacity:.85; } }
  .ccard .card-img { height: 120px; }
  .ccard .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .dash-item { display: flex; align-items: center; gap: 10px; background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  .dash-item img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: #334155; }
  .dash-thumb { width: 54px; height: 54px; border-radius: 8px; background: #334155; display: flex; align-items: center; justify-content: center; color: #64748B; font-size: 18px; flex-shrink: 0; }
  .dash-info { flex: 1; min-width: 0; }
  .dash-title { font-size: 13px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-meta { font-size: 10px; color: #64748B; margin-top: 2px; }
  .dash-del { background: none; border: none; color: #EF4444; cursor: pointer; font-size: 14px; padding: 8px; }
  .dash-empty { text-align: center; color: #64748B; font-size: 13px; padding: 24px 0; }
</style>
</head>
<body>

<div class="header">
  <div class="logo-box">
    <img src="assets/logo.svg" alt="Hackathon India">
    <div class="brand">HACKATHON<br>INDIA</div>
  </div>
  <div class="search">
    <i class="fas fa-search s-icon"></i>
    <input id="searchInput" type="text" placeholder="Search events, states, or cities..." autocomplete="off">
    <div class="suggest" id="suggestBox" style="display:none"></div>
  </div>
  <div class="user-box">
    <div class="post-menu-wrap">
      <button class="btn-primary" onclick="togglePostMenu()"><i class="fas fa-plus"></i>&nbsp; Post <i class="fa-solid fa-chevron-down" style="font-size:10px;margin-left:4px"></i></button>
      <div class="post-menu" id="postMenu" style="display:none">
        <button onclick="openPostFlow();closePostMenu()"><i class="fas fa-plus"></i> Post Hackathon</button>
        <button onclick="openDashboard();closePostMenu()"><i class="fa-solid fa-gauge-high"></i> My Posts</button>
      </div>
    </div>
    <button class="btn-primary outline-btn ending-btn" id="endingBtn" onclick="showEndingToday()"><i class="fa-solid fa-fire"></i>&nbsp; <span id="endingCount">0</span></button>
  </div>
</div>
<button class="top-btn" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<div class="filters" id="filters"></div>
<div class="updated-line" id="updatedLine" style="display:none"></div>
<div id="app"><div class="spinner"><i class="fas fa-spinner fa-spin"></i>Loading hackathons...</div></div>

<div class="detail-wrap" id="detailWrap" style="display:none"></div>
<div class="modal-overlay" id="postOverlay" style="display:none" onclick="if(event.target===this)closeCommunityDetail()"></div>

<div class="modal-overlay" id="userPostOverlay" style="display:none" onclick="if(event.target===this)closeUserPost()">
  <div class="modal">
    <div class="modal-head">
      <h2>Post a Hackathon</h2>
      <button class="modal-x" onclick="closeUserPost()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sub">It will appear in the COMMUNITY section for everyone to see. Posts auto-remove after the deadline.</div>
    <div class="field"><label>Your name *</label><input id="upName" type="text" placeholder="e.g. Rahul Sharma"></div>
    <div class="field"><label>Hackathon name *</label><input id="upTitle" type="text" placeholder="e.g. Smart India Hackathon 2026"></div>
    <div class="field"><label>Description</label><textarea id="upDesc" rows="3" placeholder="Short description..."></textarea></div>
    <div class="field"><label>Registration start date</label><input id="upStart" type="date"></div>

async function api(path, opts) {
  opts = opts || {};
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, opts, {
    headers: Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, opts.headers || {})
  }));
  if (!r.ok) { let m='API error '+r.status; try{ m = (await r.json()).message || m; }catch(e){} throw new Error(m); }

function statusOf(h) {
  const now = new Date();
  const end = h.end_date ? new Date(h.end_date+'T23:59:59') : null;
  const start = h.start_date ? new Date(h.start_date+'T00:00:00') : null;
  if (end && end < now) return { text:'ENDED', cls:'bend' };
  if (h.mode === 'online') return { text:'ONLINE', cls:'bon' };
  if (start && start <= now && (!end || end >= now)) return { text:'LIVE', cls:'blive' };
  return { text:'UPCOMING', cls:'bup' };
}
function fmtDate(d){ if(!d) return 'TBA'; const x=new Date(d+'T00:00:00'); if(isNaN(x)) return 'TBA'; return x.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); }
function countdown(d){ if(!d) return ''; const diff=new Date(d+'T23:59:59')-new Date(); if(diff<0) return '<div class="countdown closed">Registration closed</div>'; const days=Math.floor(diff/86400000); if(days>0) return '<div class="countdown">Registration ends in '+days+' days</div>'; const hrs=Math.floor(diff/3600000); return hrs>0?'<div class="countdown">Ends in '+hrs+' hours</div>':'<div class="countdown">Ends soon</div>'; }
function placeText(h){ if(h.mode==='online') return 'Online'; return [h.city,(h.states||{}).name].filter(Boolean).join(', '); }

}
  function phColors(id){ const p=[['#1a1a4e','#0d0d2b'],['#1a3a2e','#0d1f17'],['#2e1a3a','#1a0d22'],['#3a2a1a','#221a0d']]; return p[id%p.length]; }

  }
  function phOf(h, size){
    const name=(h&&h.title||'Hackathon').trim();
    let hue=0; for(const c of name) hue=(hue*31+c.charCodeAt(0))%360;
    const bg='linear-gradient(135deg, hsl('+hue+',65%,28%), hsl('+((hue+70)%360)+',60%,20%))';

function tagsOf(h){ const t=[]; if(h.mode) t.push(h.mode.toUpperCase()); if(h.states&&h.states.name) t.push(h.states.name.toUpperCase()); if(h.city) t.push(h.city.toUpperCase()); return t.slice(0,3); }

/* ---------- Suggestions (Google-style) ---------- */
function buildSuggestions(q){
  const low=q.toLowerCase(); if(!low) return [];
  const out=[],seen=new Set(); const add=s=>{ if(!seen.has(s)){seen.add(s);out.push(s);} };
  const states=stateNames();
  states.forEach(s=>{ if(s.toLowerCase().startsWith(low)) add(s); });
  states.forEach(s=>{ if(s.toLowerCase().includes(low)&&!s.toLowerCase().startsWith(low)) add(s); });
  if('online hackathons'.includes(low)) add('Online hackathons');
  if('government hackathons'.includes(low)) add('Government hackathons');
  if(/govt|government|sarkar|sarkari|ministry/.test(low)) add('Government hackathons');
  allHackathons.forEach(h=>{ if(out.length>=8)return; if(h.title.toLowerCase().includes(low)) add(h.title); if(out.length<8&&h.city&&h.city.toLowerCase().includes(low)) add(h.city); });
  return out.slice(0,8);
}
function showSuggestions(list){

}

  else { searchInput.value=s; query=s; }

}

    if(selectedFilter==='ONLINE') return h.mode==='online';
    if(selectedFilter==='UPCOMING') return statusOf(h).text!=='ENDED';

}

async function submitCommunityPost(){
  const name=document.getElementById('upName').value.trim();
  if(!name){ toast('Please enter your name'); return; }
  const title=document.getElementById('upTitle').value.trim();
  if(!title){ toast('Please enter the hackathon name'); return; }
  const start=document.getElementById('upStart').value;
  const deadline=document.getElementById('upDeadline').value;
  if(!deadline){ toast('Please pick a registration deadline'); return; }
  const pass=document.getElementById('upPass').value.trim();
  if(!/^\d{6}$/.test(pass)){ toast('Delete password must be exactly 6 digits'); return; }
  const desc=document.getElementById('upDesc').value.trim();
  const website=document.getElementById('upWebsite').value.trim();
  const contact=document.getElementById('upContact').value.trim();
  const btn=document.getElementById('upSubmit');
  btn.disabled=true; btn.textContent='Posting...';
  try{
    const saved=await api('rpc/insert_community_post',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ p_user_name: name, p_title: title, p_description: desc||null, p_start_date: start||null, p_deadline: deadline, p_website: website||null, p_contact: contact||null, p_delete_pass: pass }) });
    const id=saved && (saved.id || (Array.isArray(saved)&&saved[0]&&saved[0].id));
    if(!id) throw new Error('Could not save the post');
    saveMyPost(id, pass);
    toast('Posted! Remember your 6-digit password to delete it.');
    closeUserPost();
    ['upName','upTitle','upDesc','upWebsite','upContact'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('upStart').value='';
    document.getElementById('upDeadline').value='';
    document.getElementById('upPass').value='';
    await loadCommunity();
    renderGrid();
  }catch(e){ toast('Error: '+e.message); }
  finally{ btn.disabled=false; btn.textContent='Post Hackathon'; }
}

  if(!confirm('Delete this hackathon post?')) return;
  const entered=prompt('Enter your 6-digit delete password:');
  if(entered===null) return;
  const pass=String(entered).trim();
  if(!/^\d{6}$/.test(pass)){ toast('Password must be 6 digits'); return; }
  if(pass!==myPassFor(id)){ toast('Wrong password'); return; }
  try{
    const ok=await api('rpc/delete_post',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ p_id: id, p_pass: pass }) });
    if(!ok) throw new Error('Could not delete. The password does not match.');
    removeMyPost(id);
    toast('Deleted');
    closeDashboard();
    await loadCommunity();
    renderGrid();
  }catch(e){ toast('Error: '+e.message); }
}

/* ---------- Community data + display ---------- */
let endingToday = [];
let endingByState = [];
async function loadCommunity(){
  try{
    const today=new Date().toISOString().split('T')[0];
    const rows=await api('user_hackathons?select=id,user_name,title,description,start_date,deadline,website,contact,is_active,created_at&is_active=eq.true&deadline=gte.'+today+'&order=created_at.desc&limit=50');
    communityPosts=rows||[];
    endingToday=communityPosts.filter(h=>h.deadline===today);
  }catch(e){ communityPosts=[]; endingToday=[]; }
}
function computeEndingToday(){
  const today=new Date().toISOString().split('T')[0];
  const counts={};
  let total=0;
  allHackathons.forEach(h=>{ if(h.end_date===today){ total++; const s=(h.states||{}).name||'Online'; counts[s]=(counts[s]||0)+1; }});
  communityPosts.forEach(h=>{ if(h.deadline===today){ total++; counts['Community']=(counts['Community']||0)+1; }});
  endingToday=total;
  endingByState=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
}
function renderEndingBar(){
  computeEndingToday();
  const btn=document.getElementById('endingBtn');
  const cnt=document.getElementById('endingCount');
  btn.style.display='inline-block';
  cnt.textContent=endingToday>0?endingToday:'0';
}
function showEndingToday(){
  computeEndingToday();
  let html='<div class="modal"><div class="modal-head"><h2><i class="fa-solid fa-fire"></i> Ending Today</h2><button class="modal-x" onclick="closeEndingToday()"><i class="fa-solid fa-xmark"></i></button></div>';
  if(!endingToday){
    html+='<div class="sub" style="text-align:center;padding:24px 0;color:#94A3B8"><i class="fa-solid fa-calendar-check" style="font-size:32px;margin-bottom:8px;display:block;color:#334155"></i>No hackathons ending today. All clear!</div>';
  }else{
    html+='<div class="sub">'+endingToday+' total ending today</div>';
    html+=endingByState.map(function(s){ return '<div class="d-row"><i class="fa-solid fa-map-location-dot"></i> <b>'+esc(s[0])+'</b> — '+s[1]+' hackathon'+(s[1]>1?'s':'')+'</div>'; }).join('');
    html+='<div style="margin-top:14px">';
    const today=new Date().toISOString().split('T')[0];
    allHackathons.forEach(function(h){ if(h.end_date===today){ html+='<div class="dash-item"><div class="dash-thumb"><i class="fa-solid fa-flag"></i></div><div class="dash-info"><div class="dash-title">'+esc(h.title)+'</div><div class="dash-meta">'+esc((h.states||{}).name||'Online')+(h.city?' · '+esc(h.city):'')+'</div></div></div>'; }});
    communityPosts.forEach(function(h){ if(h.deadline===today){ html+='<div class="dash-item"><div class="dash-thumb" style="background:#7C3AED"><i class="fa-solid fa-flag"></i></div><div class="dash-info"><div class="dash-title">'+esc(h.title)+'</div><div class="dash-meta">Community · Posted by '+esc(h.user_name||'Anonymous')+'</div></div></div>'; }});
    html+='</div>';
  }
  html+='</div>';
  document.getElementById('postOverlay').innerHTML=html;
  document.getElementById('postOverlay').style.display='flex';
}
function closeEndingToday(){ const ov=document.getElementById('postOverlay'); ov.style.display='none'; ov.innerHTML=''; }
function communityCard(h){
  return '<div class="card ccard" onclick="openCommunityDetail('+h.id+')">'+
    '<div class="card-img"><div class="ph" style="font-size:34px;color:rgba(255,255,255,.14)"><i class="fa-solid fa-flag"></i></div>'+
    '<div class="overlay"></div><span class="badge-status cbadge">COMMUNITY</span>'+
    '<div class="title">'+esc(h.title)+'</div></div>'+
    '<div class="card-body">'+
    (h.user_name?'<div class="org-row"><div class="org-avatar">'+esc((h.user_name[0]||'?').toUpperCase())+'</div><div class="org-name">Posted by '+esc(h.user_name)+'</div></div>':'')+
    (h.description?'<div class="meta-row" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5">'+esc(h.description)+'</div>':'')+
    (h.start_date?'<div class="meta-row"><i class="fa-solid fa-flag-checkered"></i> Starts: <b>'+fmtDate(h.start_date)+'</b></div>':'')+
    '<div class="meta-row"><i class="fa-solid fa-hourglass-end"></i> Deadline: <b>'+fmtDate(h.deadline)+'</b></div>'+
    '<div class="tags">'+(h.website?'<span class="tag"><i class="fa-solid fa-globe"></i> website</span>':'')+(h.contact?'<span class="tag"><i class="fa-solid fa-address-book"></i> contact</span>':'')+'</div>'+
    '</div></div>';
}
function openCommunityDetail(id){
  const h=communityPosts.find(x=>x.id===id);
  if(!h) return;
  document.getElementById('postOverlay').innerHTML='<div class="modal">'+
    '<div class="modal-head"><h2>'+esc(h.title)+'</h2><button class="modal-x" onclick="closeCommunityDetail()"><i class="fa-solid fa-xmark"></i></button></div>'+
    (h.description?'<div class="about">'+esc(h.description)+'</div>':'')+
    '<div class="section">'+
    (h.user_name?'<div class="d-row"><i class="fa-solid fa-user"></i> Posted by <b>'+esc(h.user_name)+'</b></div>':'')+
    (h.start_date?'<div class="d-row"><i class="fa-solid fa-flag-checkered"></i> Registration starts: <b>'+fmtDate(h.start_date)+'</b></div>':'')+
    '<div class="d-row"><i class="fa-solid fa-hourglass-end"></i> Registration deadline: <b>'+fmtDate(h.deadline)+'</b> &middot; auto-removes after</div>'+
    (h.contact?'<div class="d-row"><i class="fa-solid fa-address-book"></i> Contact: <b>'+esc(h.contact)+'</b></div>':'')+
    '</div>'+
    (h.website?'<a class="action-btn primary" target="_blank" rel="noopener" href="'+esc(h.website)+'"><i class="fa-solid fa-globe"></i> Visit Website</a>':'')+
    '</div>';
  document.getElementById('postOverlay').style.display='flex';
}
function closeCommunityDetail(){ const ov=document.getElementById('postOverlay'); ov.style.display='none'; ov.innerHTML=''; }

function renderCommunityGrid(){
  const list=getFiltered();
  if(!list.length){ app.innerHTML='<div class="empty"><i class="fa-regular fa-flag"></i>No community posts yet. <a class="link" onclick="openPostFlow()">Post one now</a></div>'; return; }
  app.innerHTML='<div class="grid">'+list.map(communityCard).join('')+'</div>';
}

/* ---------- Search ---------- */
searchInput.addEventListener('input', e=>{ query=e.target.value; showSuggestions(buildSuggestions(e.target.value)); renderGrid(); });
searchInput.addEventListener('keydown', e=>{
  const items=suggestBox.querySelectorAll('.suggest-item');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(items.length){ hlIdx=e.key==='ArrowDown'?(hlIdx+1)%items.length:(hlIdx-1+items.length)%items.length; items.forEach((it,i)=>it.classList.toggle('hl',i===hlIdx)); items[hlIdx].scrollIntoView({block:'nearest'}); }
  } else if(e.key==='Enter'){
    if(hlIdx>=0&&items[hlIdx]){ pickSuggestion(items[hlIdx].dataset.v); return; }
    suggestBox.style.display='none'; hlIdx=-1;
    const q=query.trim(); const full=stateNames().find(s=>s.toLowerCase()===q.toLowerCase());
    if(full) pickSuggestion(full);
    else if(/^(government|govt|sarkari|sarkar|ministry)$/i.test(q)) pickSuggestion('Government hackathons');
    else renderGrid();
  }
});
document.addEventListener('click', e=>{ if(!e.target.closest('.search')){ suggestBox.style.display='none'; hlIdx=-1; } });

/* ---------- Load ---------- */
async function load(){
  app.innerHTML='<div class="spinner"><i class="fas fa-spinner fa-spin"></i>Loading hackathons...</div>';
  try{
    const [hack]=await Promise.all([
      api('hackathons?select=*,states(name),organizers(*)&is_active=eq.true&order=start_date')
    ]);
    allHackathons=hack;
    await loadCommunity();
    let lastUpd=null;
    allHackathons.forEach(x=>{ const t=x.created_at?new Date(x.created_at):null; if(t&&!isNaN(t)&&(!lastUpd||t>lastUpd)) lastUpd=t; });
    const ul=document.getElementById('updatedLine');
    if(lastUpd){ ul.style.display='flex'; ul.innerHTML=(navigator.onLine?'':'<span class="off-chip">OFFLINE</span> ')+'<span class="dot"></span> Updated daily at 9 AM IST &middot; Last refresh: <b>'+lastUpd.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'})+'</b>'; }
    renderFilters(); renderGrid();
    renderEndingBar();
  }catch(e){
    app.innerHTML='<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>Could not load.<br><small>'+esc(e.message)+'</small><br><br><button class="btn-primary" onclick="load()">Retry</button></div>';
  }
}
load();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => toast('Install Hackathon India as an app - look for "Add to Home Screen"'), 1500);
});
const topBtn=document.getElementById('topBtn');
window.addEventListener('scroll', ()=>{ topBtn.classList.toggle('show', window.scrollY>600); });

</script>
