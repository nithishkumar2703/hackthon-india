const suggestBox = document.getElementById('suggestBox');

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function stateNames() {
  const set = new Set();
  allHackathons.forEach(h => { if (h.states && h.states.name) set.add(h.states.name); });
  return [...set].sort();
}

function buildSuggestions(q) {
  const low = q.toLowerCase();
  if (!low) return [];
  const out = [];
  const seen = new Set();
  const add = s => { if (!seen.has(s)) { seen.add(s); out.push(s); } };
  const states = stateNames();
  states.forEach(s => { if (s.toLowerCase().startsWith(low)) add(s); });
  states.forEach(s => { if (s.toLowerCase().includes(low) && !s.toLowerCase().startsWith(low)) add(s); });
  if ('online hackathons'.includes(low)) add('Online hackathons');
  if ('government hackathons'.includes(low)) add('Government hackathons');
  if (/govt|government|sarkar|sarkari|ministry/.test(low)) add('Government hackathons');
  allHackathons.forEach(h => {
    if (out.length >= 8) return;
    if (h.title.toLowerCase().includes(low)) add(h.title);
    if (out.length < 8 && h.city && h.city.toLowerCase().includes(low)) add(h.city);
  });
  return out.slice(0, 8);
}

function showSuggestions(list) {
  if (!list.length) { suggestBox.style.display = 'none'; return; }
  suggestBox.innerHTML = '<div class="suggest-label">SUGGESTIONS</div>' + list.map(s => {
    const isState = stateNames().includes(s);
    const isOnline = s === 'Online hackathons';
    const isGov = s === 'Government hackathons';
    const icon = isState ? '🗺️' : isOnline ? '🌐' : isGov ? '🏛️' : '🔍';
    return '<div class="suggest-item" onclick="pickSuggestion(\''+s.replace(/'/g,"\\'")+'\')"><span class="s-icon">'+icon+'</span><span>'+esc(s)+'</span></div>';
  }).join('');
  suggestBox.style.display = 'block';
}

function pickSuggestion(s) {
  suggestBox.style.display = 'none';
  if (s === 'Online hackathons') {
    selectedFilter = 'ONLINE';
    searchInput.value = '';
    query = '';
  } else if (s === 'Government hackathons') {
    selectedFilter = 'GOVERNMENT';
    searchInput.value = '';
    query = '';
  } else if (stateNames().includes(s)) {
    selectedFilter = s.toUpperCase();
    searchInput.value = '';
    query = '';
  } else {
    searchInput.value = s;
    query = s;
  }
  renderFilters();
  renderGrid();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search')) suggestBox.style.display = 'none';
});

function statusOf(h) {
  const now = new Date();
  const end = h.end_date ? new Date(h.end_date+'T23:59:59') : null;
  const start = h.start_date ? new Date(h.start_date+'T00:00:00') : null;
  if (end && end < now) return { text: 'ENDED', cls: 'badge-ended' };
  if (h.mode === 'online') return { text: 'ONLINE', cls: 'badge-online' };
  if (start && start <= now && (!end || end >= now)) return { text: 'LIVE', cls: 'badge-live' };
  return { text: 'UPCOMING', cls: 'badge-upcoming' };
}

function fmtDate(d) {
  if (!d) return 'TBA';
  const x = new Date(d+'T00:00:00');
  if (isNaN(x)) return 'TBA';
  return x.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}

function countdown(d) {
  if (!d) return '';
  const diff = new Date(d+'T23:59:59') - new Date();
  if (diff < 0) return '<div class="countdown closed">Registration closed</div>';
  const days = Math.floor(diff / 86400000);
  if (days > 0) return '<div class="countdown">Registration ends in '+days+' days</div>';
  const hours = Math.floor(diff / 3600000);
  if (hours > 0) return '<div class="countdown">Ends in '+hours+' hours</div>';
  return '<div class="countdown">Ends soon</div>';
}

function placeText(h) {
  if (h.mode === 'online') return 'Online';
  return [h.city, (h.states||{}).name].filter(Boolean).join(', ');
}

function domainOf(url) {
  try { return url.replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].split(':')[0]; } catch(e) { return ''; }
}

function isGovernment(h) {
  const hay = ((h.title||'') + ' ' + (h.description||'') + ' ' + (h.tagline||'') + ' ' + ((h.organizers||{}).name||'')).toLowerCase();
  return /government|govt\.?|ministry|ministries|aicte|isro\b|drdo\b|defence|niti aayog|niti\b|municipal|smart india|panchayat|police|public health|railway|bharat sarkar|sarkari|government of|\btamil nadu\b.*\bgovt|\bgovt.*\btamil nadu\b/.test(hay);
}

function phColor(id) {
  const pairs = [['#1a1a4e','#0d0d2b'],['#1a3a2e','#0d1f17'],['#2e1a3a','#1a0d22'],['#3a2a1a','#221a0d']];
  return pairs[id % pairs.length];
}

function catEmoji(name) {
  return /ctf|cyber|secur|hack|pwn/i.test(name) ? '🛡️' : /ai|ml|llm|robot|agent/i.test(name) ? '🤖' : /game|gaming|jam/i.test(name) ? '🎮' : /health|medic|bio/i.test(name) ? '🩺' : /financ|fintech|bank/i.test(name) ? '📈' : /space|aero|drone|rocket/i.test(name) ? '🚀' : /green|climate|sustain|eco/i.test(name) ? '🌿' : /code|dev|program/i.test(name) ? '💻' : /data|ml|analy/i.test(name) ? '📊' : '🏆';
}

function phOf(h, size) {
  const name = (h && h.title || 'Hackathon').trim();
  let hue = 0; for (const c of name) hue = (hue * 31 + c.charCodeAt(0)) % 360;
  const bg = 'linear-gradient(135deg, hsl('+hue+',65%,28%), hsl('+((hue+70)%360)+',60%,20%))';
  const mode = h && h.mode === 'online' ? 'ONLINE' : h && h.states && h.states.name ? h.states.name : '';
  return '<div class="ph" style="background:'+bg+'">' +
    '<div class="ph-emoj">'+catEmoji(name)+'</div>' +
    '<div class="ph-title">'+esc(name)+'</div>' +
    (mode ? '<span class="ph-mode">'+esc(mode)+'</span>' : '') +
    '</div>';
}

function thumbHTML(h, size) {
  const tnGovt = h && isGovernment(h) && h.states && /tamil nadu/i.test(h.states.name);
  const ph = phOf(h, size);
  if (!h || !h.thumbnail_url) {
    if (tnGovt) return '<div class="ph-wrap '+size+'">'+ph+'<img class="'+size+' logo-img govt-img" src="assets/tn-govt.svg" alt="" loading="lazy"></div>';
    const dom = domainOf(h.website_url || '');
    if (dom) return '<div class="ph-wrap '+size+'">'+ph+'<img class="'+size+' logo-img" src="https://www.google.com/s2/favicons?domain='+esc(dom)+'&sz=128" alt="" loading="lazy" onerror="this.remove()"></div>';
    return '<div class="ph-wrap '+size+'">'+ph+'</div>';
  }
  return '<div class="ph-wrap '+size+'">'+ph+'<img class="'+size+'" src="'+esc(h.thumbnail_url)+'" loading="lazy" onerror="this.remove()"></div>';
}

function renderFilters() {
  const stateSet = new Set();
  allHackathons.forEach(h => { if (h.states && h.states.name) stateSet.add(h.states.name.toUpperCase()); });
  const states = [...stateSet].sort();
  const items = ['ALL INDIA', 'GOVERNMENT', ...states, 'ONLINE', 'UPCOMING'];
  filtersEl.innerHTML = items.map(f => {
    const sel = f === selectedFilter;
    let cls = 'chip';
    if (sel) cls += f === 'ALL INDIA' || f === 'ONLINE' || f === 'UPCOMING' || f === 'GOVERNMENT' ? ' active-green' : ' active-purple';
    return '<span class="'+cls+'" onclick="selectFilter(\''+f+'\')">'+f+'</span>';
  }).join('');
}

function selectFilter(f) {
  selectedFilter = f;
  renderFilters();
  renderGrid();
}

function getFiltered() {
  const q = query.toLowerCase();
  return allHackathons.filter(h => {
    if (q) {
      const hay = [h.title, h.description, h.city, (h.states||{}).name, (h.organizers||{}).name||''].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (selectedFilter === 'ALL INDIA') return true;
    if (selectedFilter === 'GOVERNMENT') return isGovernment(h);
    if (selectedFilter === 'ONLINE') return h.mode === 'online';
    if (selectedFilter === 'UPCOMING') return statusOf(h).text !== 'ENDED';
    return (h.states||{}).name && h.states.name.toUpperCase() === selectedFilter;
  });
}

function renderGrid() {
  const items = getFiltered();
  if (!items.length) {
    app.innerHTML = '<div class="spinner">No hackathons found</div>';
    return;
  }
  app.innerHTML = '<div class="grid">' + items.map(h => {
    const st = statusOf(h);
    const img = thumbHTML(h, '');
    const org = h.organizers || {};
    return '<div class="card" onclick="openDetail('+h.id+')">' +
      '<div class="card-img">' + img +
      '<div class="overlay"></div>' +
      (isGovernment(h) ? '<span class="gov-badge">🏛️ GOVT</span>' : '') +
      '<span class="badge-status '+st.cls+'">'+st.text+'</span>' +
      '<div class="title">'+esc(h.title)+'</div>' +
      '</div>' +
      '<div class="card-body">' +
      (org.name ? '<div class="org-row"><div class="org-avatar">'+esc(org.name[0]||'?')+'</div><div class="org-name">'+esc(org.name)+'</div></div>' : '') +
      '<div class="meta-row"><span class="icon">📍</span> '+esc(placeText(h) || 'Online')+'</div>' +
      '<div class="meta-row"><span class="icon">📅</span> '+fmtDate(h.start_date)+' — '+fmtDate(h.end_date)+'</div>' +
      (h.prize_pool ? '<div class="prize-row"><span class="prize-label">Prize pool</span><span class="prize-val">'+esc(h.prize_pool)+'</span></div>' : '') +
      countdown(h.deadline) +
      '</div></div>';
  }).join('') + '</div>';
}

async function openDetail(id) {
  app.innerHTML = '<div class="spinner">Loading...</div>';
  try {
    const h = HACKATHON_SAMPLE.find(x => x.id === id);
    if (!h) { app.innerHTML = '<div class="error-box">Not found</div>'; return; }
    const st = statusOf(h);
    const org = h.organizers || {};
    const img = thumbHTML(h, 'detail-hero');
    let html = '<div class="detail-page">' +
      '<div class="back-btn" onclick="renderAll()">← Back to explore</div>' + img +
      '<div class="detail-card">' +
      '<span class="detail-badge '+st.cls+'">'+st.text+'</span>' +
      '<div class="detail-title">'+esc(h.title)+'</div>' +
      (h.tagline ? '<div class="detail-tagline">'+esc(h.tagline)+'</div>' : '') +
      '<div class="detail-section">' +
      '<div class="detail-row"><span class="d-icon">📍</span> '+esc(placeText(h) || 'Online')+'</div>' +
      '<div class="detail-row"><span class="d-icon">📅</span> '+fmtDate(h.start_date)+' — '+fmtDate(h.end_date)+'</div>' +
      '<div class="detail-row"><span class="d-icon">💻</span> '+(h.mode||'hybrid').charAt(0).toUpperCase()+(h.mode||'hybrid').slice(1)+' event</div>' +
      (h.deadline ? '<div class="detail-row"><span class="d-icon">⏰</span> Registration deadline: '+fmtDate(h.deadline)+'</div>' : '') +
      '</div>';
    if (h.prize_pool) {
      html += '<div class="detail-section"><div class="detail-row"><span class="d-icon">🏆</span> <span class="prize-big">'+esc(h.prize_pool)+'</span></div></div>';
    }
    if (org.name) {
      html += '<div class="detail-section"><div class="detail-row"><div class="org-avatar" style="width:28px;height:28px;font-size:14px">'+esc(org.name[0]||'?')+'</div><div><div style="font-size:11px;color:#94A3B8">Organized by</div><div style="font-size:14px;font-weight:600;color:#fff">'+esc(org.name)+'</div></div></div></div>';
    }
    if (h.description) html += '<div class="about">'+esc(h.description)+'</div>';
    if (h.website_url) html += '<a class="action-btn primary" target="_blank" href="'+esc(h.website_url)+'">🌐 Visit Official Website</a>';
    if (org.whatsapp || org.email || org.phone) {
      html += '<div class="btn-row">';
      if (org.whatsapp) html += '<a class="action-btn outline" target="_blank" href="https://wa.me/'+org.whatsapp.replace(/\D/g,'')+'">💬 WhatsApp</a>';
      if (org.email) html += '<a class="action-btn outline" href="mailto:'+esc(org.email)+'">✉️ Email</a>';
      if (org.phone) html += '<a class="action-btn outline" href="tel:+'+org.phone.replace(/\D/g,'')+'">📞 Call</a>';
      html += '</div>';
    }
    html += '</div></div>';
    app.innerHTML = html;
    window.scrollTo(0, 0);
  } catch (e) {
    app.innerHTML = '<div class="error-box">'+esc(e.message)+'</div>';
  }
}

async function renderAll() {
  app.innerHTML = '<div class="spinner">Loading hackathons...</div>';
  try {
    allHackathons = HACKATHON_SAMPLE.map(x => ({...x}));
    renderFilters();
    renderGrid();
  } catch (e) {
    app.innerHTML = '<div class="error-box">Could not load hackathons.<br><small>'+esc(e.message)+'</small></div>';
  }
}

searchInput.addEventListener('input', e => {
  query = e.target.value;
  showSuggestions(buildSuggestions(e.target.value));
  renderGrid();
});
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    suggestBox.style.display = 'none';
    const q = query.trim();
    const full = stateNames().find(s => s.toLowerCase() === q.toLowerCase());
    if (full) pickSuggestion(full);
    else if (/^(government|govt|sarkari|sarkar|ministry)$/i.test(q)) pickSuggestion('Government hackathons');
    else if (q) renderGrid();
  }
});
renderAll();
</script>
</body>
</html>
